# https://picom.app/
# https://man.archlinux.org/man/picom.1#FORMAT_OF_CONDITIONS

# Specify the backend to use: `xrender`, `glx`, or `egl`.
#
# Default: "xrender"
# xrender causes shadows to leave artifacts with animations
backend = "glx"

# Fading
# fading = true;
# fade-delta = 5;
# fade-in-step = 0.03;
# fade-out-step = 0.03;
# no-fading-openclose = true;
# no-fading-destroyed-argb = true;
# fade-exclude = [ ];

blur-background-exclude = [
  # prevents picom from blurring the background
  # "role   = 'xborder'"
];

# Rounded corners
corner-radius = 12;
rounded-corners-exclude = [
  "name = 'Picture-in-Picture'"
];
# conditional radius configuration
# corner-radius-rules = [
#   "12:class_g = 'Rofi'"
# ];

# Shadow
# Enabled client-side shadows on windows.
shadow = true;
# The blur radius for shadows. (default 12)
shadow-radius = 16;
# The left offset for shadows. (default -15)
shadow-offset-x = -11;
# The top offset for shadows. (default -15)
shadow-offset-y = -11;
# The translucency for shadows. (default .75)
shadow-opacity = .6;

# The shadow exclude options are helpful if you have shadows enabled. Due to the way compton draws its shadows, certain applications will have visual glitches
# (most applications are fine, only apps that do weird things with xshapes or argb are affected).
# This list includes all the affected apps I found in my testing. The "! name~=''" part excludes shadows on any "Unknown" windows, this prevents a visual glitch with the XFWM alt tab switcher.
shadow-exclude = [
  # "! name~=''", # For windows with no name property
  "name = 'Notification'",
  "name *= 'compton'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
  "name = 'Notification'",
	"_GTK_FRAME_EXTENTS@",
  "class_g = 'i3-frame'"
  # "I3_FLOATING_WINDOW@" # disable shadows on floating windows since shadows render weirdly with animations enabled
];
# Avoid drawing shadow on all shaped windows (see also: --detect-rounded-corners)
shadow-ignore-shaped = false;

# Transparency
# Don't use compton to make terminal transparent because the text will also become transparent
opacity-rule = [
  "0:_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[0] = '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[1] = '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[2] = '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[3] = '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[4] = '_NET_WM_STATE_HIDDEN'",
  "95:class_g ?= 'Code'",
  "95:class_g ?= 'Code - Insiders'",
  "90:class_g = 'i3-frame'",
  "97:class_g = 'Spotify'",
  "95:class_g = 'obsidian'",
  "97:name ~= 'Discord$'" # only the main discord window, not a popout stream
];

# Window type settings
wintypes:
{
    tooltip =
    {
        # fade: Fade the particular type of windows.
        fade = true;
        # shadow: Give those windows shadow
        shadow = false;
        # opacity: Default opacity for the type of windows.
        opacity = 0.80;
        # focus: Whether to always consider windows of this type focused.
        focus = true;
    };
    dnd =
    {
      shadow = false;
    };
    dock =
    {
      shadow = false;
    };
};

#################################
#      Animation Settings       #
#################################
# https://github.com/lactua/dotfiles/blob/3fe1e4ff636125aa49c89a98ba3718859d0393c0/source/.config/picom/picom.conf#L426

animations = (
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "linear";
      duration = 0.11;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.2;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      # https://cubic-bezier.com/#0,1.3,1,.95
      curve = "cubic-bezier(0,1.3,1,0.95)";
      duration = 0.3;
      start = 0.9;
      end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["geometry"]
    scale-x = {
      # https://cubic-bezier.com/#0,0,0,1.15
      curve = "cubic-bezier(0,0,0,1.15)";
      duration = 0.22;
      start = "window-width-before / window-width";
      end = 1;
    }
    scale-y = {
      curve = "cubic-bezier(0,0,0,1.15)";
      duration = 0.22;
      start = "window-height-before / window-height";
      end = 1;
    }
    offset-x = {
      curve = "cubic-bezier(0,0,0,1.15)";
      duration = 0.22;
      start = "window-x-before - window-x";
      end = 0;
    }
    offset-y = {
      curve = "cubic-bezier(0,0,0,1.15)";
      duration = 0.22;
      start = "window-y-before - window-y";
      end = 0;
    }

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
)